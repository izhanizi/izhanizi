<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Muhammad Izhan profile banner</title>
  <desc id="desc">Dark premium developer banner with glowing purple and cyan accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#090d18"/>
      <stop offset="45%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1a1029"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glowA" cx="20%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#8b5cf6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="80%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.70"/>
      <stop offset="40%" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1200" height="240" fill="url(#bg)"/>

  <circle cx="180" cy="55" r="170" fill="url(#glowA)" filter="url(#softBlur)"/>
  <circle cx="980" cy="70" r="180" fill="url(#glowB)" filter="url(#softBlur)"/>

  <g opacity="0.35">
    <path d="M0 180 C180 150, 260 110, 390 150 S620 210, 760 165 S1030 110, 1200 150 L1200 240 L0 240 Z" fill="none" stroke="url(#lineGrad)" stroke-width="2"/>
    <path d="M0 200 C150 170, 240 140, 420 175 S650 220, 825 178 S1040 145, 1200 188" fill="none" stroke="url(#lineGrad)" stroke-width="1.5" opacity="0.7"/>
  </g>

  <g opacity="0.22">
    <circle cx="110" cy="46" r="2" fill="#e2e8f0"/>
    <circle cx="140" cy="78" r="2" fill="#e2e8f0"/>
    <circle cx="190" cy="54" r="2" fill="#e2e8f0"/>
    <circle cx="1040" cy="44" r="2" fill="#e2e8f0"/>
    <circle cx="1080" cy="74" r="2" fill="#e2e8f0"/>
    <circle cx="1115" cy="56" r="2" fill="#e2e8f0"/>
  </g>

  <g>
    <rect x="72" y="58" width="120" height="3" rx="1.5" fill="url(#lineGrad)" opacity="0.9"/>
    <rect x="72" y="165" width="140" height="3" rx="1.5" fill="url(#lineGrad)" opacity="0.9"/>
  </g>

  <g fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="600" y="112" text-anchor="middle" font-size="34" font-weight="700" letter-spacing="1.5">MUHAMMAD IZHAN</text>
    <text x="600" y="150" text-anchor="middle" font-size="17" font-weight="500" fill="#cbd5e1" letter-spacing="3">FULL STACK DEVELOPER</text>
  </g>

  <g>
    <rect x="490" y="170" width="220" height="3" rx="1.5" fill="url(#lineGrad)"/>
  </g>
</svg>
